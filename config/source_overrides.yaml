# =============================================================================
# Estrategia de ingesta por fuente (complementa la hoja "Fuentes" del Excel).
#
# El Excel sigue siendo la fuente única de verdad para QUÉ fuentes existen.
# Este archivo solo define CÓMO se leen. Si una fuente nueva aparece en el
# Excel y no está aquí, `sources_loader` le asigna una estrategia por defecto
# según "Estado de la revisión" y "Nota" (RSS descubierto → búsqueda).
#
# Campos por fuente (clave = columna "#"):
#   connectors        orden de ejecución: bcrp_api | rss | inbox | search | static_index
#                     ([] = fuente de consulta: no se monitorea semanalmente)
#   fallback_only     conectores que solo corren si los anteriores no trajeron nada
#   feed_url          RSS confirmado (si no, se intenta descubrir)
#   search_query      consulta Brave (usar `site:dominio`)
#   inbox_senders     dominios/remitentes del boletín en el buzón IMAP
#   index_url / index_link_pattern   página índice + regex de links nuevos
#   require_keywords  filtra ítems por vocabulario comex (medios generalistas)
#   paywalled         solo titular + fecha + resumen público (nunca el cuerpo)
#   official          fuente oficial primaria (prioridad en deduplicación)
#   bcrp_series       códigos de series BCRPData para el Radar de Cifras
# =============================================================================

defaults:
  # Fuentes generalistas: vocabulario mínimo para que un ítem pase a curación.
  keywords:
